<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Transaction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Edit Transaction</h1>
        <nav>
            <a href="{{ url_for('index') }}">Dashboard</a> |
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class=flashes>
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('edit_transaction', transaction_id=transaction.id) }}">
            <div>
                <label for="type">Type:</label>
                <select id="type" name="type" required>
                    <option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Income</option>
                    <option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Expense</option>
                </select>
            </div>
            <div>
                <label for="category">Category:</label>
                <input type="text" id="category" name="category" value="{{ transaction.category }}" required>
            </div>
            <div>
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" value="{{ transaction.description if transaction.description }}">
            </div>
            <div>
                <label for="amount">Amount:</label>
                <input type="number" step="0.01" id="amount" name="amount" value="{{ transaction.amount }}" required>
            </div>
            <div>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" value="{{ transaction.date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div>
                <button type="submit">Update Transaction</button>
            </div>
        </form>
        <form method="POST" action="{{ url_for('delete_transaction', transaction_id=transaction.id) }}" style="margin-top: 20px;">
            <button type="submit" onclick="return confirm('Are you sure you want to delete this transaction?');" class="danger">Delete Transaction</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2024 My Flask App</p>
        <nav class="bottom-nav">
             <a href="{{ url_for('index') }}">Home/Transazioni</a>
             <a href="{{ url_for('taxes') }}">Tasse</a>
             <a href="{{ url_for('profile_page') }}">Profilo</a>
        </nav>
    </footer>
</body>
</html>

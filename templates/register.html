<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati - FinDash</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .flashes { list-style: none; padding: 0; margin: 1em 0; }
        .flashes li { padding: 0.75em 1.25em; margin-bottom: 1em; border: 1px solid transparent; border-radius: 0.25rem; }
        .flashes li.success { color: #0f5132; background-color: #d1e7dd; border-color: #badbcc; }
        .flashes li.danger { color: #842029; background-color: #f8d7da; border-color: #f5c2c7; }
        .flashes li.warning { color: #664d03; background-color: #fff3cd; border-color: #ffecb5; }
        .flashes li.info { color: #055160; background-color: #cff4fc; border-color: #b6effb; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md space-y-8">
            <div>
                <h1 class="text-3xl font-bold text-center text-blue-600">FinDash</h1>
                <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-gray-900">
                    Crea un nuovo account
                </h2>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <ul class="flashes">
                {% for category, message in messages %}
                  <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}" class="mt-8 space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
                <div class="rounded-md shadow-sm">
                    <div class="mb-4">
                        <label for="username" class="block text-sm font-medium text-gray-700 sr-only">Username</label>
                        <input type="text" id="username" name="username" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-500 focus:ring-opacity-50 p-3"
                               placeholder="Username">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-gray-700 sr-only">Email</label>
                        <input type="email" id="email" name="email" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-500 focus:ring-opacity-50 p-3"
                               placeholder="Indirizzo Email">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 sr-only">Password</label>
                        <input type="password" id="password" name="password" required
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-500 focus:ring-opacity-50 p-3"
                               placeholder="Password">
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Registrati
                    </button>
                </div>
            </form>
            <p class="mt-8 text-center text-sm text-gray-600">
                Hai già un account?
                <a href="{{ url_for('login') }}" class="font-medium text-blue-600 hover:text-blue-500">
                    Accedi qui
                </a>
            </p>
        </div>
    </div>
</body>
</html>

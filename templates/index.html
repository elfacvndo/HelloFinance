<html><head><link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" /><link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" /><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><style>
body {
    font-family: Inter, sans-serif;
    margin: 0;
    background-color: #f3f4f6; /* Light gray background */
    color: #1f2937; /* Dark gray text */
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background-color: #ffffff; /* White header */
    border-bottom: 1px solid #e5e7eb; /* Light gray border */
}

.logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: #2563eb; /* Blue logo */
}

.main-nav { /* Added class for easier targeting if needed */
    flex-grow: 1; /* Allow main-nav to take up space */
    display: flex;
    justify-content: flex-start; /* Align items to the start */
    padding-left: 20px; /* Add some padding from logo */
}

.main-nav a {
    margin-right: 20px; /* Use margin-right for spacing between items */
    margin-left: 0; /* Reset margin-left if previously set */
    text-decoration: none;
    color: #4b5563; /* Medium gray nav links */
    font-weight: 500;
}

.main-nav a:hover {
    color: #2563eb; /* Blue hover */
}

.auth-links { /* Wrapper for auth links if needed, ensure it's distinct */
    display: flex; /* Use flexbox for alignment */
    align-items: center; /* Vertically align items in auth-links */
}

.auth-links span { /* Style for the greeting message */
    margin-right: 15px; /* Space between greeting and logout */
    color: #4b5563;
    font-weight: 500;
}

.auth-links a {
    margin-left: 15px;
    text-decoration: none;
    padding: 8px 15px;
    border-radius: 6px;
    font-weight: 500;
}

.auth-links .login {
    color: #2563eb;
    border: 1px solid #2563eb;
}

.auth-links .login:hover {
    background-color: #eff6ff; /* Light blue hover */
}

.auth-links .register {
    color: #ffffff;
    background-color: #2563eb; /* Blue background */
    border: 1px solid #2563eb;
}
.auth-links .register:hover {
    background-color: #1d4ed8; /* Darker blue hover */
}


.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.card {
    background-color: #ffffff;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.card h2 {
    margin-top: 0;
    font-size: 1.25rem;
    color: #111827; /* Almost black titles */
}

.transactions-list {
    list-style: none;
    padding: 0;
}

.transactions-list li {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #e5e7eb;
}
.transactions-list li:last-child {
    border-bottom: none;
}

.transaction-amount.income {
    color: #16a34a; /* Green for income */
}

.transaction-amount.expense {
    color: #dc2626; /* Red for expense */
}

.filter-buttons {
    margin-bottom: 15px;
}

.filter-buttons .button {
    padding: 8px 15px;
    margin-right: 10px;
    border: 1px solid #d1d5db; /* Gray border */
    border-radius: 6px;
    background-color: #ffffff;
    color: #374151; /* Darker gray text */
    cursor: pointer;
    text-decoration: none;
}

.filter-buttons .button.active,
.filter-buttons .button:hover {
    background-color: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
}

.add-transaction-btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #2563eb;
    color: #ffffff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
    margin-top: 15px;
}
.add-transaction-btn:hover {
    background-color: #1d4ed8;
}


/* Bottom Navigation */
.bottom-nav-placeholder { /* Added placeholder for spacing if needed */
    height: 70px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #ffffff;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
}

.bottom-nav a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #6b7280; /* Icon/Text color */
    font-size: 0.75rem;
}

.bottom-nav a svg { /* Basic styling for SVGs */
    width: 24px;
    height: 24px;
    margin-bottom: 4px;
}

.bottom-nav a.active {
    color: #2563eb; /* Active link color */
}
/* Basic styles for flashed messages */
.flashes {
    list-style: none;
    padding: 0;
    margin: 1em 0;
}
.flashes li {
    padding: 0.75em 1.25em;
    margin-bottom: 1em;
    border: 1px solid transparent;
    border-radius: 0.25rem;
}
.flashes li.success {
    color: #0f5132;
    background-color: #d1e7dd;
    border-color: #badbcc;
}
.flashes li.danger {
    color: #842029;
    background-color: #f8d7da;
    border-color: #f5c2c7;
}
.flashes li.warning {
    color: #664d03;
    background-color: #fff3cd;
    border-color: #ffecb5;
}
.flashes li.info {
    color: #055160;
    background-color: #cff4fc;
    border-color: #b6effb;
}
